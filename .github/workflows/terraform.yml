   name: Terraform checks

   on:
     push:
       branches: [main]
     pull_request:

   jobs:
     validate:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: hashicorp/setup-terraform@v3
         - name: Format check
           run: terraform fmt -check
         - name: Init
           run: terraform init -backend=false
         - name: Validate
           run: terraform validate
